<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #f5f6fa;
  font-family: 'Inter', sans-serif;
  color: #1a1a2e;
}

/* ── HEADER ── */
.page-header {
  background: #1a3a5c;
  color: white;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.header-left h1 {
  font-size: 15px; font-weight: 700; letter-spacing: .3px;
}
.header-left p {
  font-size: 11px; opacity: .75; margin-top: 3px;
}
.header-right {
  display: flex; gap: 20px; flex-wrap: wrap;
}
.hstat { text-align: center; }
.hstat-n { font-size: 18px; font-weight: 700; color: #f0c040; }
.hstat-l { font-size: 10px; opacity: .7; }

/* ── CONTROLS ── */
.controls {
  background: white;
  border-bottom: 1px solid #e0e4ec;
  padding: 10px 32px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.controls span { font-size: 12px; color: #666; }
.btn {
  background: white; border: 1px solid #d0d5dd;
  color: #444; font-family: 'Inter', sans-serif;
  font-size: 11px; font-weight: 500;
  padding: 5px 12px; border-radius: 5px;
  cursor: pointer; transition: all .15s;
}
.btn:hover { background: #f0f4ff; border-color: #1a3a5c; color: #1a3a5c; }
.btn.active { background: #1a3a5c; color: white; border-color: #1a3a5c; }

/* ── LEGEND ── */
.legend {
  display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; align-items: center;
}
.leg { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #555; }
.leg-box { width: 14px; height: 14px; border-radius: 3px; }

/* ── CANVAS ── */
.canvas-wrap {
  overflow: auto;
  padding: 24px 16px 48px;
  background: #f5f6fa;
  min-height: calc(100vh - 120px);
}
.canvas {
  display: inline-block;
  min-width: max-content;
}

/* ── TREE LAYOUT ── */
.tree-row {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 0;
}
.tree-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── NODE BOX ── */
.node {
  border-radius: 5px;
  padding: 7px 10px;
  text-align: center;
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.35;
  min-width: 110px;
  max-width: 130px;
  position: relative;
  cursor: pointer;
  transition: filter .15s, transform .15s;
  border: 1.5px solid transparent;
  user-select: none;
}
.node:hover { filter: brightness(.92); transform: translateY(-1px); }
.node .nid {
  display: block;
  font-size: 9px; font-weight: 700;
  letter-spacing: .4px;
  margin-bottom: 2px;
  opacity: .75;
}

/* Level colours */
.lvl0 { background: #1a3a5c; color: white; font-size: 12px; font-weight: 700; min-width: 160px; max-width: 180px; border-radius: 7px; cursor: default; }
.lvl0:hover { filter:none; transform:none; }

.lvl1-0 { background: #2563a8; color: white; border-color: #1e4f8c; } /* Gestión */
.lvl1-1 { background: #7b3fa0; color: white; border-color: #6230850; } /* Sistema */
.lvl1-2 { background: #1e7a45; color: white; border-color: #155e36; } /* Calidad */
.lvl1-3 { background: #c2590f; color: white; border-color: #9e4509; } /* Implementación */
.lvl1-4 { background: #a0265a; color: white; border-color: #7e1c47; } /* Capacitación */
.lvl1-5 { background: #1a7070; color: white; border-color: #145757; } /* Post-impl */

.lvl2 { background: #dce8f8; color: #1a3a5c; border-color: #9ab8de; font-size: 10px; min-width: 105px; max-width: 125px; }
.lvl3 { background: #eef4fd; color: #2c4a6e; border-color: #b8cfe8; font-size: 9.5px; min-width: 100px; max-width: 120px; }
.lvl4 { background: #f7faff; color: #445566; border-color: #cddaeb; font-size: 9px; font-weight: 400; min-width: 95px; max-width: 115px; }

/* tint lvl2/3/4 per branch */
.b0 .lvl2 { background:#dce8f8; border-color:#9ab8de; }
.b0 .lvl3 { background:#eef4fd; border-color:#b8cfe8; }
.b0 .lvl4 { background:#f7faff; border-color:#cddaeb; }

.b1 .lvl2 { background:#ecdff5; border-color:#c9a8e0; }
.b1 .lvl3 { background:#f5eefb; border-color:#d9c4ec; }
.b1 .lvl4 { background:#faf6fe; border-color:#e5d8f5; }

.b2 .lvl3 { background:#ebf7f1; border-color:#aadcc0; }
.b2 .lvl4 { background:#f4fbf7; border-color:#c5ebd5; }

.b3 .lvl3 { background:#fef3eb; border-color:#f5caa8; }

.b4 .lvl3 { background:#fceef6; border-color:#f0bcd6; }

.b5 .lvl3 { background:#ebf8f8; border-color:#a8dcdc; }
.b5 .lvl4 { background:#f4fbfb; border-color:#c4e8e8; }

/* ── CONNECTORS ── */
.v-line   { width:1px; background:#aab8cc; }
.h-line   { height:1px; background:#aab8cc; }

.connector-down  { width:1px; height:16px; background:#aab8cc; flex-shrink:0; }
.connector-up    { width:1px; height:16px; background:#aab8cc; flex-shrink:0; }

/* horizontal bar connecting siblings */
.h-bar-row {
  display:flex; align-items:stretch;
  width:100%;
}

/* child group */
.child-group {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.child-group.hidden { display: none; }

/* siblings row */
.siblings {
  display: flex;
  align-items: flex-start;
  gap: 0;
}
.sibling-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* count badge */
.cnt {
  position: absolute; top: -7px; right: -7px;
  background: #1a3a5c; color: white;
  font-size: 8px; font-weight: 700;
  width: 15px; height: 15px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

/* print */
@media print {
  .controls, .page-header .btn { display: none; }
  .canvas-wrap { overflow: visible; }
}
</style>

          { id:"5.2.2.1", label:"Arquitectura y modelo de datos", lv:4 },
          { id:"5.2.2.2", label:"Guía de despliegue y variables", lv:4 },

    { id:"6.0", label:"6. Post-Implementación", lv:1, cls:"lvl1-5", bi:5, ch:[
      { id:"6.1", label:"Soporte y Ajustes", lv:2, ch:[
        { id:"6.1.1", label:"Soporte Inicial (3 meses)", lv:3, ch:[
          { id:"6.1.1.1", label:"Canal soporte correo/WhatsApp", lv:4 },
          { id:"6.1.1.2", label:"Resolución de incidencias menores", lv:4 },
          { id:"6.1.1.3", label:"Actualizaciones correctivas", lv:4 },

// RENDERER
let maxLevel = 4;

function renderNode(node, branchIdx) {
  const bi = branchIdx !== undefined ? branchIdx : (node.bi !== undefined ? node.bi : 0);

  const col = document.createElement('div');
  col.className = `tree-col b${bi}`;
  col.dataset.id = node.id;
  col.dataset.lv = node.lv;

  // box
  const box = document.createElement('div');
  const lvClass = node.lv === 1 ? node.cls : `lvl${node.lv}`;
  box.className = `node ${lvClass}`;
  box.dataset.lv = node.lv;

  if (node.lv > 0) {
    const idEl = document.createElement('span');
    idEl.className = 'nid';
    idEl.textContent = node.id;
    box.appendChild(idEl);
  }

  const lbl = document.createElement('span');
  lbl.textContent = node.label;
  box.appendChild(lbl);

  if (node.ch && node.ch.length && node.lv > 0) {
    const cnt = document.createElement('div');
    cnt.className = 'cnt';
    cnt.textContent = node.ch.length;
    box.appendChild(cnt);
    box.onclick = (e) => {
      e.stopPropagation();
      const cg = col.querySelector(':scope > .child-group');
      if (cg) {
        cg.classList.toggle('hidden');
        box.style.opacity = cg.classList.contains('hidden') ? '.65' : '1';
      }
    };
    box.style.cursor = 'pointer';
  }

  col.appendChild(box);

  if (node.ch && node.ch.length) {
    // down line from box
    const vd = document.createElement('div');
    vd.className = 'connector-down';
    vd.dataset.connector = '1';
    col.appendChild(vd);

    const cg = document.createElement('div');
    cg.className = 'child-group';
    cg.dataset.parentLv = node.lv;

    if (node.lv + 1 > maxLevel) cg.classList.add('hidden');

    const siblings = document.createElement('div');
    siblings.className = 'siblings';

    node.ch.forEach((child, ci) => {
      const sBranch = document.createElement('div');
      sBranch.style.cssText = 'display:flex;flex-direction:column;align-items:center;';

      const hWrap = document.createElement('div');
      hWrap.style.cssText = 'display:flex;align-items:center;width:100%;';

      const leftH  = document.createElement('div');
      leftH.className = 'h-line';
      leftH.style.cssText = `flex:1; min-width:${ci===0?'0':'20'}px; ${ci===0?'visibility:hidden;':''}`;

      const rightH = document.createElement('div');
      rightH.className = 'h-line';
      rightH.style.cssText = `flex:1; min-width:${ci===node.ch.length-1?'0':'20'}px; ${ci===node.ch.length-1?'visibility:hidden;':''}`;

      const vUp = document.createElement('div');
      vUp.className = 'connector-up';
      vUp.dataset.connector = '1';

      hWrap.appendChild(leftH);
      hWrap.appendChild(vUp);
      hWrap.appendChild(rightH);

      sBranch.appendChild(hWrap);
      sBranch.appendChild(renderNode(child, bi));
      siblings.appendChild(sBranch);
    });

    cg.appendChild(siblings);
    col.appendChild(cg);
  }

  return col;
}

function buildTree() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(renderNode(EDT, 0));
}

function showLevel(lv) {
  maxLevel = lv;
  buildTree();
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

buildTree();
</script>
